# See docs/standards.md, "Continuous integration".
name: Tests

on:
  pull_request:
  # Keeps SonarCloud's main dashboard and its coverage current.
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App tests (iOS)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Keep in step with the local Xcode.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      # Pinned to commits, not tags that could be moved. Keep the comments in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      # A regular iPhone on the newest standard iOS runtime the image has. Runtimes
      # made for one device, such as the iPhone Duo's, are left out.
      - name: Pick the simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (r for r in devices if re.search(r"\.iOS-\d+-\d+$", r)),
              key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")],
          )
          preferred = ["iPhone 17 Pro", "iPhone 17", "iPhone 18 Pro", "iPhone 18"]
          for runtime in reversed(runtimes):
              phones = {d["name"]: d["udid"] for d in devices[runtime] if d["name"].startswith("iPhone")}
              for name in preferred + sorted(phones):
                  if name in phones:
                      print(phones[name])
                      sys.exit()
          sys.exit("No iPhone simulator on this image")
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The journeys that need the catalogue skip, because the runner has none.
      - name: Test
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -scheme Loe \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            -collect-test-diagnostics never \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E ": error: |^error: |✘|\*\* (BUILD|TEST) |Test run with|Executed .* tests" build/xcodebuild.log | sort -u || true
          exit "$status"

      - name: Export coverage
        run: scripts/coverage-to-sonar.py

      - name: Keep coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-iOS
          path: build/coverage-iOS.xml
          retention-days: 1

      - name: Keep results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  catalogue:
    name: Catalogue build tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test
        run: python3 -I -m unittest discover -s tools/catalogue

  sonar:
    name: SonarCloud scan
    needs: app
    # A fork's pull request gets no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so SonarCloud can tell new code from old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-iOS
          path: coverage

      # The one action from outside GitHub the repository allows, and only at this
      # commit. Move the pin, its version comment and the allowed pattern together.
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
