# See docs/standards.md, "Continuous integration".
name: Tests

on:
  pull_request:
  # Keeps SonarCloud's main dashboard and its coverage current.
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that changes only Markdown skips the app tests. A push to
  # `main` always runs them, so its coverage stays current.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      # Two commits deep: a pull request's merge commit and the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: See whether anything but Markdown changed
        id: diff
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          app=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! grep -qv '\.md$' <<< "$changed"; then
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  # Three parts side by side, because the journeys take most of the time. The
  # second half of the journeys is every class the first half doesn't name, so a
  # new one runs without being added here.
  app:
    name: App tests (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: unit
            tests: -only-testing:LoeTests -enableCodeCoverage YES
          - part: journeys-1
            tests: >-
              -only-testing:LoeUITests/ShelvesJourneyTests
              -only-testing:LoeUITests/OpenLibraryJourneyTests
              -only-testing:LoeUITests/PlacesJourneyTests
              -only-testing:LoeUITests/AddBookJourneyTests
          - part: journeys-2
            tests: >-
              -only-testing:LoeUITests
              -skip-testing:LoeUITests/ShelvesJourneyTests
              -skip-testing:LoeUITests/OpenLibraryJourneyTests
              -skip-testing:LoeUITests/PlacesJourneyTests
              -skip-testing:LoeUITests/AddBookJourneyTests
    env:
      # Keep in step with the local Xcode.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      # Pinned to commits, not tags that could be moved. Keep the comments in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      # A regular iPhone on the iOS the snapshot references are for: the newest
      # folder in LoeTests/Snapshots that the image has a runtime for. A newer iOS
      # on the image is left alone until its references are recorded. Runtimes made
      # for one device, such as the iPhone Duo's, are left out.
      - name: Pick the simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list --json | python3 -I -c '
          import json, os, re, sys
          listing = json.load(sys.stdin)
          recorded = sorted(
              (name[4:] for name in os.listdir("LoeTests/Snapshots") if name.startswith("iOS-")),
              key=lambda version: [int(part) for part in version.split(".")],
              reverse=True,
          )
          preferred = ["iPhone 17 Pro", "iPhone 17", "iPhone 18 Pro", "iPhone 18"]
          for version in recorded:
              for runtime in listing["runtimes"]:
                  if runtime["version"] != version or not re.search(r"\.iOS-\d+-\d+$", runtime["identifier"]):
                      continue
                  phones = {
                      d["name"]: d["udid"]
                      for d in listing["devices"].get(runtime["identifier"], [])
                      if d["name"].startswith("iPhone") and d.get("isAvailable")
                  }
                  for name in preferred + sorted(phones):
                      if name in phones:
                          print(phones[name])
                          sys.exit()
          sys.exit("No iPhone simulator on iOS " + " or ".join(recorded) + ", which the snapshot references are for")
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # A test that hangs fails after five minutes and the rest still run. A run
      # that hangs anywhere else is stopped after twenty-five, as a failure: the
      # job's own limit cancels it, and a cancelled run keeps no results.
      - name: Test
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          TESTS: ${{ matrix.tests }}
        run: |
          mkdir -p build
          status=0
          # Unquoted on purpose: one option to a word.
          perl -e 'alarm shift; exec @ARGV' 1500 xcodebuild test \
            -scheme Loe \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            $TESTS \
            > build/xcodebuild.log 2>&1 || status=$?
          if [ "$status" -eq 142 ]; then
            echo "error: the test run was stopped after 25 minutes" >> build/xcodebuild.log
          fi
          grep -E ": error: |^error: |✘|\*\* (BUILD|TEST) |Test run with|Executed .* tests" build/xcodebuild.log | sort -u || true
          exit "$status"

      # Coverage comes from the unit tests, which is where logic is tested.
      - name: Export coverage
        if: matrix.part == 'unit'
        run: scripts/coverage-to-sonar.py

      - name: Keep coverage for the scan
        if: matrix.part == 'unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-iOS
          path: build/coverage-iOS.xml
          retention-days: 1

      - name: Keep results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.part }}
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  # The check `main` requires. It passes when every part passed, and when the
  # parts were skipped because only Markdown changed.
  app-tests:
    name: App tests (iOS)
    needs: [changes, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the parts
        env:
          CHANGES: ${{ needs.changes.result }}
          PARTS: ${{ needs.app.result }}
        run: |
          echo "What changed: $CHANGES. The parts: $PARTS."
          [ "$CHANGES" = success ] && { [ "$PARTS" = success ] || [ "$PARTS" = skipped ]; }

  catalogue:
    name: Catalogue build tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test
        run: python3 -I -m unittest discover -s tools/catalogue

  sonar:
    name: SonarCloud scan
    needs: [changes, app-tests]
    # A fork's pull request gets no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so SonarCloud can tell new code from old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # No report when the app tests were skipped: nothing but Markdown changed,
      # so an empty one says all there is to say.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.changes.outputs.app == 'true'
        with:
          name: coverage-iOS
          path: coverage

      - name: Write an empty coverage report
        if: needs.changes.outputs.app != 'true'
        run: mkdir -p coverage && echo '<coverage version="1"/>' > coverage/coverage-iOS.xml

      # The one action from outside GitHub the repository allows, and only at this
      # commit. Move the pin, its version comment and the allowed pattern together.
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
