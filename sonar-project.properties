# SonarCloud analysis from the Tests workflow. See docs/standards.md, "Continuous integration".
sonar.organization=helop-ou
sonar.projectKey=helop-ou_loe-app
sonar.sources=Loe,tools/catalogue,scripts,.github
sonar.tests=LoeTests,LoeUITests,tools/catalogue
sonar.test.inclusions=LoeTests/**,LoeUITests/**,tools/catalogue/test_*.py
sonar.exclusions=**/*.xcassets/**,**/*.icon/**,Loe/Resources/**,tools/catalogue/test_*.py
sonar.test.exclusions=LoeTests/Snapshots/**,LoeTests/Fixtures/**
sonar.coverageReportPaths=coverage/coverage-iOS.xml
# SwiftUI views are checked by snapshots, journeys and the simulator, not counted
# as coverage: files named for a view's role, two named for what they show, and
# Shared/UI. The catalogue's Python is tested but reports no coverage.
sonar.coverage.exclusions=**/*View.swift,**/*Sheet.swift,**/*Picker.swift,**/*Row.swift,**/*Section.swift,**/*Menu.swift,**/*Controls.swift,Loe/Features/Search/BarcodeScanner.swift,Loe/Features/Settings/TasteQuiz.swift,Loe/Shared/UI/**,tools/catalogue/**,scripts/**,.github/**
