# SonarCloud analysis from the Tests workflow. See docs/standards.md, "Continuous integration".
sonar.organization=helop-ou
sonar.projectKey=helop-ou_loe-app
# SonarCloud analyses the whole repository and takes no list of source or test
# folders (it ignores sonar.sources and sonar.tests), so what it should leave
# alone is excluded here: assets, licence texts, snapshots, fixtures and the
# coverage report itself.
sonar.exclusions=**/*.xcassets/**,**/*.icon/**,Loe/Resources/**,LoeTests/Snapshots/**,LoeTests/Fixtures/**,coverage/**
sonar.coverageReportPaths=coverage/coverage-iOS.xml
# Tests are neither covered nor checked for repeating each other. SwiftUI views
# are checked by snapshots, journeys and the simulator, not counted as coverage:
# files named for a view's role, two named for what they show, and Shared/UI.
# The catalogue's Python is tested but reports no coverage.
sonar.coverage.exclusions=LoeTests/**,LoeUITests/**,**/*View.swift,**/*Sheet.swift,**/*Picker.swift,**/*Row.swift,**/*Section.swift,**/*Menu.swift,**/*Controls.swift,**/*Chip.swift,Loe/Features/Search/BarcodeScanner.swift,Loe/Features/Settings/TasteQuiz.swift,Loe/Shared/UI/**,tools/catalogue/**,scripts/**,.github/**
sonar.cpd.exclusions=LoeTests/**,LoeUITests/**,tools/catalogue/test_*.py
